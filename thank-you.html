<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Message Sent</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --green: #00d084; --grey: #f8f8f8; --white: #ffffff; --heading: #111111; --text: #6b6b6b; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { background: var(--grey); font-family: 'Roboto', Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .sent { text-align: center; max-width: 460px; }
        .check { width: 80px; height: 80px; border-radius: 50%; background: var(--white); color: var(--green); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
        h1 { color: var(--heading); font-size: 1.5rem; font-weight: 700; margin: 0 0 0.75rem; }
        p { color: var(--text); font-size: 1rem; line-height: 1.7; margin: 0; }
    </style>
</head>
<body>
    <div class="sent" aria-live="polite">
        <div class="check">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <h1>Message sent!</h1>
        <p>Thank you for reaching out. We'll get back to you within 24 hours.</p>
    </div>
</body>
</html>
